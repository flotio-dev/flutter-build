name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vérifie la syntaxe du script de build et la qualité du Dockerfile.
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate build script syntax
        run: bash -n build.sh

  # Contrôle les dépendances si disponible puis bloque les vulnérabilités, secrets et erreurs IaC avec Trivy.
  security-source:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Scan Dockerfile and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          timeout: 15m
          version: v0.74.0

  # Construit et scanne localement l'image pour chaque architecture sans la publier.
  platform-validation:
    name: Validate ${{ matrix.platform }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref_name == 'main') }}
    needs: [quality, security-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare immutable metadata
        id: meta
        run: |
          set -euo pipefail
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter-build"
            echo "tag=sha-$GITHUB_SHA-${{ matrix.arch }}"
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build once and load locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flutter-build.Dockerfile
          load: true
          pull: true
          platforms: ${{ matrix.platform }}
          tags: local/flutter-build:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=flutter-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=flutter-build-${{ matrix.arch }},ignore-error=true
          provenance: false
          sbom: false

      - name: Scan exact platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/flutter-build:${{ steps.meta.outputs.tag }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore-image
          timeout: 30m
          version: v0.74.0

      - name: Generate platform SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/flutter-build:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output: sbom-${{ matrix.arch }}.spdx.json
          timeout: 30m
          version: v0.74.0

      - name: Upload platform SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.arch }}-${{ github.sha }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  # Construit, scanne puis publie dans GHCR une image immuable pour chaque architecture.
  platform-publish:
    name: Publish ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [quality, security-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare immutable metadata
        id: meta
        run: |
          set -euo pipefail
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter-build"
            echo "tag=sha-$GITHUB_SHA-${{ matrix.arch }}"
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build once and load locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: flutter-build.Dockerfile
          load: true
          pull: true
          platforms: ${{ matrix.platform }}
          tags: local/flutter-build:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=flutter-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=flutter-build-${{ matrix.arch }},ignore-error=true
          provenance: false
          sbom: false

      - name: Scan exact platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/flutter-build:${{ steps.meta.outputs.tag }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore-image
          timeout: 30m
          version: v0.74.0

      - name: Generate platform SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/flutter-build:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output: sbom-${{ matrix.arch }}.spdx.json
          timeout: 30m
          version: v0.74.0

      - name: Upload platform SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.arch }}-${{ github.sha }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push exact scanned platform image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag "local/flutter-build:$TAG" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  # Assemble les images par architecture, publie le manifeste multi-architecture et ses attestations.
  create-manifest:
    name: Publish and attest multi-arch image
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: platform-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download platform SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*-${{ github.sha }}
          path: sboms
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create immutable multi-arch manifest
        id: manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter-build"
          tag="sha-$GITHUB_SHA"
          docker buildx imagetools create \
            --tag "$image:$tag" \
            --tag "$image:latest" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
          digest="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "image=$image"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sboms/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest arm64 SBOM
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sboms/sbom-arm64.spdx.json
          push-to-registry: true

      - name: Verify attestations
        if: github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"

      - name: Explain unavailable attestations
        if: github.event.repository.private && vars.ATTESTATIONS_ENABLED != 'true'
        run: echo "::notice::Artifact attestations are disabled for private repositories. Set ATTESTATIONS_ENABLED=true when GitHub Enterprise Cloud is available."

  # Associe un tag SemVer au manifeste multi-architecture lors de la création d'un tag Git.
  release-alias:
    name: Publish SemVer alias
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, security-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Alias existing SHA image
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATIONS_ENABLED: ${{ github.event.repository.private == false || vars.ATTESTATIONS_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter-build"
          source="$image:sha-$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ "$ATTESTATIONS_ENABLED" == "true" ]]; then
            gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY"
          fi
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$source"
          test "$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest"

  # Agrège les résultats obligatoires en un check stable utilisable par la protection de branche.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [quality, security-source, platform-validation, platform-publish, create-manifest, release-alias]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY_SOURCE: ${{ needs.security-source.result }}
          PLATFORM_VALIDATION: ${{ needs.platform-validation.result }}
          PLATFORM_PUBLISH: ${{ needs.platform-publish.result }}
          MANIFEST: ${{ needs.create-manifest.result }}
          RELEASE_ALIAS: ${{ needs.release-alias.result }}
        run: |
          set -euo pipefail
          test "$QUALITY" = success
          test "$SECURITY_SOURCE" = success
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE_ALIAS" = success
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            test "$PLATFORM_PUBLISH" = success
            test "$MANIFEST" = success
          elif [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            test "$PLATFORM_VALIDATION" = success
          fi
